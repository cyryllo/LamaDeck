<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ikona Ollama Manager: lama w goglach na stosie serwerów, koło zębate w tle.
       Kolory z palety theme.qss (Breeze Dark z makiet). -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1d3a4f"/>
  <!-- koło zębate za głową -->
  <g fill="#2f5873">
    <circle cx="32" cy="22" r="15"/>
    <g id="zab"><rect x="29.5" y="3.5" width="5" height="6" rx="1.2"/></g>
    <use href="#zab" transform="rotate(45 32 22)"/>
    <use href="#zab" transform="rotate(90 32 22)"/>
    <use href="#zab" transform="rotate(-45 32 22)"/>
    <use href="#zab" transform="rotate(-90 32 22)"/>
  </g>
  <circle cx="32" cy="22" r="11" fill="#1d3a4f"/>
  <!-- stos serwerów -->
  <g stroke="#3daee9" stroke-width="2" fill="#262a30">
    <rect x="13" y="36" width="38" height="7" rx="2"/>
    <rect x="13" y="45" width="38" height="7" rx="2"/>
    <rect x="13" y="54" width="38" height="7" rx="2"/>
  </g>
  <g fill="#5fd38d">
    <circle cx="18" cy="39.5" r="1.3"/>
    <circle cx="18" cy="48.5" r="1.3"/>
    <circle cx="18" cy="57.5" r="1.3"/>
  </g>
  <g stroke="#7cc8f0" stroke-width="1.6" stroke-linecap="round">
    <path d="M38 39.5h8M38 48.5h8M38 57.5h8"/>
  </g>
  <!-- lama: zakrzywione uszy, czupryna, wydłużona głowa, szyja w serwerze -->
  <g fill="#e8eaed">
    <path d="M25 15 C21.5 11.5 20.5 7 22 3.2 C24.5 5 26.5 9 28 13 Z"/>
    <path d="M39 15 C42.5 11.5 43.5 7 42 3.2 C39.5 5 37.5 9 36 13 Z"/>
    <path d="M24.5 15 Q32 12.5 39.5 15 L38.6 24 L37 31.5 Q35.6 34.5 32 34.5 Q28.4 34.5 27 31.5 L25.4 24 Z"/>
    <path d="M25.2 14.4 Q26.4 10.6 28.6 12.2 Q30 9.4 32 11.4 Q34 9.4 35.4 12.2 Q37.6 10.6 38.8 14.4 Z"/>
    <rect x="27.5" y="32" width="9" height="5"/>
  </g>
  <path d="M22.9 5.6 Q23.6 9.6 26.4 13 L27 12.6 Q25.4 8.6 22.9 5.6 Z M41.1 5.6 Q40.4 9.6 37.6 13 L37 12.6 Q38.6 8.6 41.1 5.6 Z" fill="#a3abb5"/>
  <!-- gogle -->
  <rect x="21" y="17" width="22" height="6" rx="3" fill="#3daee9"/>
  <rect x="23.5" y="18.4" width="7" height="1.5" rx="0.75" fill="#9fd6f3"/>
  <!-- nozdrza i pyszczek -->
  <g stroke="#262a30" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M30.2 29.4 l0.9 0.8 M33.8 29.4 l-0.9 0.8"/>
    <path d="M32 30.4 v1.6 M30.4 32.6 Q32 33.6 33.6 32.6"/>
  </g>
</svg>
